<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Panel</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Geist', sans-serif; background: #09090b; }
        .glass-panel { background: rgba(24, 24, 27, 0.65); backdrop-filter: blur(16px); }
        .inner-glow { box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="text-zinc-100 flex h-screen overflow-hidden antialiased">

    <!-- Sidebar Layout -->
    <aside class="w-64 bg-zinc-900/40 border-r border-zinc-800/60 flex flex-col justify-between hidden md:flex backdrop-blur-xl">
        <div class="p-6">
            <div class="flex items-center gap-3">
                <div class="h-5 w-5 bg-gradient-to-tr from-indigo-500 to-violet-400 rounded-md shadow-[0_0_20px_rgba(99,102,241,0.4)]"></div>
                <h1 class="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-200">Melonly Core</h1>
            </div>
            
            <nav class="mt-10 space-y-1">
                <a href="#" class="flex items-center text-xs font-medium px-3.5 py-2.5 rounded-lg bg-zinc-800/60 text-zinc-100 border border-zinc-700/30 inner-glow transition-all">Overview</a>
                <a href="#" class="flex items-center text-xs font-medium px-3.5 py-2.5 rounded-lg text-zinc-400 hover:bg-zinc-800/30 hover:text-zinc-200 transition-all border border-transparent">Activity Matrix</a>
            </nav>
        </div>
        
        <!-- Sidebar Profile Area -->
        <div id="sidebar-profile" class="p-6 border-t border-zinc-800/60 flex items-center bg-zinc-950/20">
            <button onclick="loginWithDiscord()" class="w-full py-3 bg-zinc-100 hover:bg-white text-zinc-950 text-xs font-semibold rounded-lg text-center tracking-wide inner-glow transition-all duration-200 shadow-sm">
                Connect Discord
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 border-b border-zinc-800/60 bg-zinc-950/40 backdrop-blur-md flex items-center justify-between px-8">
            <h2 class="text-xs font-medium tracking-wider uppercase text-zinc-400">Control Matrix</h2>
            <div class="flex items-center gap-2.5 px-3 py-1.5 bg-emerald-500/5 border border-emerald-500/20 rounded-full">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
                <span class="text-[10px] font-semibold tracking-widest uppercase text-emerald-400">Live Connection</span>
            </div>
        </header>

        <div class="p-8 lg:p-12 space-y-8 max-w-4xl w-full mx-auto">
            <!-- Modern Action Workspace Card -->
            <div class="glass-panel border border-zinc-800/80 p-8 rounded-2xl inner-glow space-y-6 shadow-xl">
                <div>
                    <h3 class="text-lg font-medium tracking-tight text-zinc-50">Trigger Operational Action</h3>
                    <p class="text-xs text-zinc-400 mt-1.5 leading-relaxed">All configurations are encrypted inside the client sandbox execution scope. Submitting will directly pipe event payloads into designated BotGhost endpoints.</p>
                </div>

                <div class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-semibold uppercase tracking-[0.15em] text-zinc-500 mb-2">Payload Data / System Input</label>
                        <input type="text" id="webhook-msg" value="Staff verification sequence initialized." class="w-full bg-zinc-950 border border-zinc-800/80 rounded-xl px-4 py-3.5 text-xs text-zinc-200 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all font-mono">
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="sendWebhook()" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-xl tracking-wide border border-indigo-400/20 inner-glow transition-all duration-200 shadow-[0_4px_20px_rgba(79,70,229,0.15)]">
                        Dispatch Action Packet
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURATION VARIABLES ====================
        const DISCORD_CLIENT_ID = 'YOUR_DISCORD_CLIENT_ID'; 
        const BOTGHOST_WEBHOOK_URL = 'YOUR_BOTGHOST_WEBHOOK_URL';
        
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        // =================================================================

        let userData = null;

        function loginWithDiscord() {
            if (DISCORD_CLIENT_ID === 'YOUR_DISCORD_CLIENT_ID') {
                return alert('Please replace hardcoded variables inside the script block.');
            }
            const scope = 'identify';
            const authUrl = `https://discord.com{DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;
        }

        async function checkCallback() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.replaceState({}, document.title, window.location.pathname);
                
                try {
                    const response = await fetch('https://discord.com', {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    userData = await response.json();
                    updateProfileUI(userData);
                } catch (err) {
                    console.error('Callback parsing execution breakdown:', err);
                }
            }
        }

        function updateProfileUI(user) {
            const profileArea = document.getElementById('sidebar-profile');
            const avatarUrl = user.avatar ? `https://discordapp.com{user.id}/${user.avatar}.png` : 'https://discordapp.com';
            
            profileArea.innerHTML = `
                
                <div class="flex-1 overflow-hidden ml-3.5">
                    <p class="text-xs font-medium text-zinc-200 truncate">${user.username}</p>
                    <p class="text-[10px] text-zinc-500 font-mono tracking-tight mt-0.5 truncate">ID: ${user.id}</p>
                </div>
                <button onclick="logout()" class="text-[11px] font-medium text-zinc-500 hover:text-zinc-300 transition-colors ml-2 uppercase tracking-wider">Exit</button>
            `;
        }

        function logout() {
            window.location.reload();
        }

        async function sendWebhook() {
            if (BOTGHOST_WEBHOOK_URL === 'YOUR_BOTGHOST_WEBHOOK_URL') {
                return alert('Configuration variable BOTGHOST_WEBHOOK_URL is missing.');
            }

            const message = document.getElementById('webhook-msg').value;
            
            const payload = {
                content: message,
                embeds: [{
                    title: "Dashboard Session Dispatch",
                    color: 2500134, // Matches zinc aesthetic hex values
                    fields: [
                        { name: "Operator Username", value: userData ? `${userData.username} (<@${userData.id}>)` : "Anonymous Session", inline: true },
                        { name: "Operator ID", value: userData ? userData.id : "Null / Extraneous", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const res = await fetch(BOTGHOST_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) alert('Packet successfully funneled to BotGhost endpoint.');
                else alert('Endpoint rejected system payload packet.');
            } catch(e) {
                alert('CORS restriction block encountered or endpoint offline. Review dev tools via F12.');
                console.error(e);
            }
        }

        window.onload = checkCallback;
    </script>
</body>
</html>
