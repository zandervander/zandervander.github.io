<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melonly Style Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex h-screen overflow-hidden antialiased">

    <!-- Sidebar Layout -->
    <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <div class="flex items-center gap-2">
                <div class="h-4 w-4 bg-indigo-500 rounded-sm shadow-[0_0_12px_rgba(99,102,241,0.5)]"></div>
                <h1 class="text-sm font-bold uppercase tracking-wider text-zinc-200">Melonly Panel</h1>
            </div>
            
            <nav class="mt-8 space-y-1.5">
                <a href="#" class="flex items-center text-xs font-medium px-3 py-2.5 rounded-md bg-indigo-600/10 text-indigo-400 border border-indigo-500/20">Overview</a>
                <a href="#" class="flex items-center text-xs font-medium px-3 py-2.5 rounded-md text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200 transition-all">Activity Logs</a>
            </nav>
        </div>
        
        <!-- Sidebar Profile Area -->
        <div id="sidebar-profile" class="p-5 border-t border-zinc-800 flex items-center bg-zinc-900/50">
            <button onclick="loginWithDiscord()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-md text-center tracking-wide transition-colors duration-200">
                Connect Discord
            </button>
        </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 border-b border-zinc-800 bg-zinc-900/30 backdrop-blur-md flex items-center justify-between px-8">
            <h2 class="text-sm font-semibold tracking-tight text-zinc-300">Dashboard Control</h2>
            <div class="flex items-center gap-2">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-medium tracking-wider uppercase text-emerald-400">System Connected</span>
            </div>
        </header>

        <div class="p-8 space-y-6 max-w-4xl w-full mx-auto">
            <!-- Modern Info Card -->
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl space-y-5">
                <div>
                    <h3 class="text-base font-semibold tracking-tight text-zinc-100">Trigger Mod Action</h3>
                    <p class="text-xs text-zinc-400 mt-1">All variables run locally from this system profile. Submit to route direct telemetry to BotGhost hooks.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-zinc-500 mb-1.5">Action Notes / Case Details</label>
                        <input type="text" id="webhook-msg" value="Staff activity update logged." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2.5 text-xs text-zinc-200 focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="sendWebhook()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-md tracking-wide transition-colors duration-200">
                        Send Authenticated Webhook
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURATION VARIABLES ====================
        const DISCORD_CLIENT_ID = 'YOUR_DISCORD_CLIENT_ID'; 
        const BOTGHOST_WEBHOOK_URL = 'YOUR_BOTGHOST_WEBHOOK_URL';
        
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        // =================================================================

        let userData = null;

        function loginWithDiscord() {
            if (DISCORD_CLIENT_ID === 'YOUR_DISCORD_CLIENT_ID') {
                return alert('Please replace hardcoded variables in the script tag first!');
            }
            const scope = 'identify';
            const authUrl = `https://discord.com{DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scope}`;
            window.location.href = authUrl;
        }

        async function checkCallback() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.replaceState({}, document.title, window.location.pathname);
                
                try {
                    const response = await fetch('https://discord.com', {
                        headers: { Authorization: `Bearer ${accessToken}` }
                    });
                    userData = await response.json();
                    updateProfileUI(userData);
                } catch (err) {
                    console.error('Failed to grab Discord user profile data', err);
                }
            }
        }

        function updateProfileUI(user) {
            const profileArea = document.getElementById('sidebar-profile');
            const avatarUrl = user.avatar ? `https://discordapp.com{user.id}/${user.avatar}.png` : 'https://discordapp.com';
            
            profileArea.innerHTML = `
                <img src="${avatarUrl}" class="w-8 h-8 rounded-md border border-zinc-700 bg-zinc-800" alt="Avatar">
                <div class="flex-1 overflow-hidden ml-3">
                    <p class="text-xs font-semibold text-zinc-200 truncate">${user.username}</p>
                    <p class="text-[10px] text-zinc-500 tracking-tight truncate">ID: ${user.id}</p>
                </div>
                <button onclick="logout()" class="text-[11px] font-medium text-zinc-500 hover:text-red-400 transition-colors ml-2">Exit</button>
            `;
        }

        function logout() {
            window.location.reload();
        }

        async function sendWebhook() {
            if (BOTGHOST_WEBHOOK_URL === 'YOUR_BOTGHOST_WEBHOOK_URL') {
                return alert('Please set your BotGhost Webhook URL variable!');
            }

            const message = document.getElementById('webhook-msg').value;
            
            const payload = {
                content: message,
                embeds: [{
                    title: "Dashboard Action Triggered",
                    color: 5793266, 
                    fields: [
                        { name: "Authorized User", value: userData ? `${userData.username} (<@${userData.id}>)` : "Anonymous", inline: true },
                        { name: "User ID", value: userData ? userData.id : "N/A", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const res = await fetch(BOTGHOST_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) alert('Webhook successfully fired to BotGhost!');
                else alert('Webhook failed. Target endpoint rejected the browser transaction.');
            } catch(e) {
                alert('CORS Blocked or Server Error. Read the developer log console (F12).');
                console.error(e);
            }
        }

        window.onload = checkCallback;
    </script>
</body>
</html>
