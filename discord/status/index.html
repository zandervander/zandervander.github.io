<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden; 
        }

        #cutscene-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111; 
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1s ease-in-out; 
        }

        .cutscene-content {
            text-align: center;
            animation: pulseText 2s infinite alternate;
        }

        .cutscene-content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .cutscene-content p {
            font-size: 1.2rem;
            color: #aaa;
        }

        #skip-btn {
            position: absolute;
            bottom: 40px;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        #skip-btn:hover {
            background: #fff;
            color: #111;
        }

        @keyframes pulseText {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        
        #main-website {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: #000000; 
        }
    </style>
</head>
<body>

    
    <div id="cutscene-overlay">
        <div class="cutscene-content">
            <h1>ZanderVander</h1>
            <p>Discord Account</p>
        </div>
        <!-- <button id="skip-btn" onclick="endCutscene()">Skip Intro</button> -->
    </div>

    <div id="main-website">
        <div style="padding: 50px; text-align: center; color: #999999;">
            <h1>ZanderVander</h1>
            <p>Discord</p>
            <p>Status Page available at status.zandervander.net</p>
            <p>Discord bot developer</p>
            <p>now get outta here</p>
    <script>
        setTimeout(function() {
            endCutscene();
        }, 4000);

        function endCutscene() {
            const overlay = document.getElementById('cutscene-overlay');
            overlay.style.opacity = '0';
            
            setTimeout(function() {
                overlay.style.display = 'none';
                document.documentElement.style.overflow = 'auto';
                document.body.style.overflow = 'auto';
            }, 1000); 
        }
    </script>
</body>
</html>
