<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Press Start</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    button {
      padding: 12px 20px;
      border: 1px solid #222;
      border-radius: 6px;
      background: #fff;
      color: #222;
      font: 16px Arial, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #eee; }

    #player {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <button id="start" type="button">Press Start to Begin</button>

  <script>
    document.getElementById('start').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      button.hidden = true;

      const player = document.createElement('iframe');
      player.id = 'player';
      player.title = 'YouTube video';
      player.allow = 'autoplay; encrypted-media; fullscreen';
      player.allowFullscreen = true;
      player.src = 'https://www.youtube.com/embed/41S9jEY4L8o?autoplay=1&playsinline=1&rel=0';
      document.body.appendChild(player);

      try {
        await document.documentElement.requestFullscreen();
      } catch (_) {
        // Fullscreen can be blocked by some browsers.
      }
    });
  </script>
</body>
</html>
