<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Press Start</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      background: #09090b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .start-screen {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100svh;
      background: radial-gradient(ellipse at center, #202027 0%, #09090b 68%);
    }
    .start-button {
      padding: 1rem 2rem;
      border: 2px solid #fff;
      border-radius: 0.4rem;
      color: #fff;
      background: transparent;
      font: inherit;
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, transform 150ms ease;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .start-button:hover, .start-button:focus-visible {
      color: #09090b;
      background: #fff;
      transform: scale(1.04);
      outline: none;
    }
    .player {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #000;
    }
    .player[hidden] { display: none; }
    .player iframe { width: 100%; height: 100%; border: 0; }
    .close-button {
      position: absolute;
      z-index: 1;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid #ffffff80;
      border-radius: 50%;
      color: #fff;
      background: #0009;
      font-size: 1.5rem;
      cursor: pointer;
    }
    @keyframes pulse { 50% { opacity: 0.65; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="start-screen" id="startScreen">
    <button class="start-button" id="startButton" type="button">Press Start to Begin</button>
  </main>

  <section class="player" id="player" aria-label="YouTube video player" hidden>
    <button class="close-button" id="closeButton" type="button" aria-label="Close video">×</button>
  </section>

  <script>
    const startButton = document.getElementById('startButton');
    const startScreen = document.getElementById('startScreen');
    const player = document.getElementById('player');
    const closeButton = document.getElementById('closeButton');

    startButton.addEventListener('click', () => {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/41S9jEY4L8o?autoplay=1&playsinline=0&rel=0';
      iframe.title = 'YouTube video';
      iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      iframe.allowFullscreen = true;
      player.appendChild(iframe);
      startScreen.hidden = true;
      player.hidden = false;
      player.requestFullscreen?.().catch(() => {});
    });

    closeButton.addEventListener('click', () => {
      player.querySelector('iframe')?.remove();
      player.hidden = true;
      startScreen.hidden = false;
      if (document.fullscreenElement) document.exitFullscreen?.();
      startButton.focus();
    });
  </script>
</body>
</html>
