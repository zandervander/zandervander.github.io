<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control Terminal — Melonly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: radial-gradient(1200px 600px at 10% 10%, rgba(99,102,241,0.05), transparent), #030303; }
    .heading-font { font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto; }
    .neon-card { background: linear-gradient(135deg, rgba(15,15,20,0.6), rgba(6,6,8,0.7)); border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02); }
  </style>
</head>
<body class="text-zinc-100 flex h-screen overflow-hidden antialiased">

  <div class="absolute inset-0 pointer-events-none" aria-hidden>
    <div class="absolute -left-64 -top-48 w-[48rem] h-[48rem] bg-gradient-to-tr from-indigo-600/10 to-transparent rounded-full blur-3xl"></div>
  </div>

  <aside class="w-72 bg-zinc-950/60 border-r border-zinc-900 flex flex-col justify-between hidden md:flex backdrop-blur-xl z-10">
    <div class="p-6">
      <div class="flex items-center gap-3 py-2">
        <div class="h-8 w-8 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-lg shadow-[0_0_20px_rgba(139,92,246,0.3)]"></div>
        <h1 class="heading-font text-sm font-bold uppercase tracking-[0.25em] text-white">Melonly</h1>
      </div>
      <nav class="mt-10 space-y-1">
        <a href="#" class="flex items-center text-sm font-semibold px-4 py-3 rounded-xl bg-zinc-900/50 text-white border border-zinc-800/50 transition-all">Overview</a>
      </nav>
    </div>

    <div id="sidebar-profile" class="p-6 border-t border-zinc-900 bg-zinc-950/40">
      <button id="connect-btn" onclick="loginWithDiscord()" class="w-full py-3 text-white text-sm font-bold rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 shadow-md">Connect Discord</button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-y-auto z-10 bg-zinc-950/10">
    <header class="h-20 border-b border-zinc-900/60 bg-zinc-950/20 backdrop-blur-xl flex items-center justify-between px-8">
      <h2 class="heading-font text-xs font-semibold tracking-[0.15em] uppercase text-zinc-400">System Interface</h2>
      <div class="flex items-center gap-3 px-4 py-2 bg-emerald-500/5 border border-emerald-500/10 rounded-xl">
        <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_12px_#10b981] animate-pulse"></span>
        <span class="heading-font text-[10px] font-bold tracking-widest uppercase text-emerald-400">Live API</span>
      </div>
    </header>

    <div class="p-8 lg:p-12 space-y-8 max-w-3xl w-full mx-auto">
      <div class="neon-card p-8 rounded-2xl space-y-6">
        <div>
          <h3 class="heading-font text-2xl font-bold tracking-tight text-white">Trigger Operational Payload</h3>
          <p class="text-sm text-zinc-400 mt-1.5 leading-relaxed">Execute manual webhook operations via a backend script tunnel. Login persists via cookies for this session.</p>
        </div>

        <div class="space-y-5">
          <div>
            <label for="webhook-msg" class="heading-font text-xs font-bold uppercase tracking-[0.2em] text-zinc-500 mb-2.5 block">Transmission Message</label>
            <input id="webhook-msg" type="text" value="Manual terminal dispatch event verified." class="w-full rounded-xl px-4 py-3.5 text-sm text-zinc-100 bg-zinc-900/40 border border-zinc-800/60 focus:outline-none focus:ring-2 focus:ring-purple-600" />
          </div>
        </div>

        <div class="pt-4 flex justify-between items-center">
          <div class="text-xs text-zinc-400">Operator: <span id="operator-name">Unverified Web Session</span></div>
          <div class="flex gap-3">
            <button id="logout-btn" onclick="logout()" class="hidden px-4 py-2 rounded-lg border border-zinc-800 text-sm">Sign out</button>
            <button onclick="sendWebhook()" class="px-6 py-3.5 text-xs font-bold rounded-xl tracking-wider uppercase bg-gradient-to-r from-indigo-600 to-purple-600">Dispatch Payload Packet</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // ==================== CONFIGURATION VARIABLES ====================
    const DISCORD_CLIENT_ID = '1540155835676889108'; // set to your client id
    const BOTGHOST_WEBHOOK_URL = 'YOUR_BOTGHOST_WEBHOOK_URL_HERE';
    // =================================================================

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    let userData = null;

    // Simple cookie helpers
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days*24*60*60*1000));
      const expires = "expires=" + d.toUTCString();
      document.cookie = name + "=" + encodeURIComponent(value) + ";" + expires + ";path=/;SameSite=Lax";
    }
    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? decodeURIComponent(v.pop()) : null;
    }
    function deleteCookie(name) { document.cookie = name + '=; Max-Age=0; path=/;'; }

    function loginWithDiscord() {
      if (!DISCORD_CLIENT_ID || DISCORD_CLIENT_ID.includes('YOUR')) {
        return alert('Please set DISCORD_CLIENT_ID in the script.');
      }
      const scope = 'identify';
      const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${scope}`;
      window.location.href = authUrl;
    }

    async function fetchDiscordProfile(token) {
      try {
        const res = await fetch('https://discord.com/api/users/@me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Profile fetch failed');
        return await res.json();
      } catch (e) {
        console.error('fetchDiscordProfile error', e);
        return null;
      }
    }

    function updateProfileUI(user) {
      const profileArea = document.getElementById('sidebar-profile');
      const connectBtn = document.getElementById('connect-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const operator = document.getElementById('operator-name');

      const avatarUrl = user && user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}${user.avatar.startsWith('a_') ? '.gif' : '.png'}` : '';

      profileArea.innerHTML = `
        <div class="flex items-center w-full bg-zinc-900/40 border border-zinc-800/60 p-3 rounded-xl shadow-inner mb-3">
          <img src="${avatarUrl}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" class="w-10 h-10 rounded-lg border border-zinc-800 bg-zinc-900 shadow-sm" alt="Profile">
          <div class="flex-1 overflow-hidden ml-3">
            <p class="heading-font text-sm font-bold text-zinc-100 truncate">${user.username}#${user.discriminator}</p>
            <p class="text-xs text-zinc-400 truncate">ID: ${user.id}</p>
          </div>
        </div>
        <button id="logout-button" class="w-full text-center py-2 text-[12px] font-bold text-zinc-200 hover:text-white border border-dashed border-zinc-800 rounded-lg uppercase tracking-widest">Sign out</button>
      `;

      const signOut = document.getElementById('logout-button');
      if (signOut) signOut.addEventListener('click', logout);
      if (connectBtn) connectBtn.hidden = true;
      if (logoutBtn) logoutBtn.classList.remove('hidden');
      if (operator) operator.textContent = `${user.username}#${user.discriminator}`;
    }

    function logout() {
      deleteCookie('discord_token');
      deleteCookie('discord_user');
      window.location.href = window.location.pathname; // remove hash and reload
    }

    async function checkCallback() {
      // 1) If token in URL fragment, consume it and save to cookie
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = fragment.get('access_token');
      if (accessToken) {
        // clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
        // save token cookie for 7 days
        setCookie('discord_token', accessToken, 7);
        const profile = await fetchDiscordProfile(accessToken);
        if (profile) {
          setCookie('discord_user', JSON.stringify(profile), 7);
          userData = profile;
          updateProfileUI(profile);
        }
        return;
      }

      // 2) If cookie token present, use it
      const tokenFromCookie = getCookie('discord_token');
      const userCookie = getCookie('discord_user');
      if (tokenFromCookie) {
        // prefer the stored user object if available
        if (userCookie) {
          try { userData = JSON.parse(userCookie); updateProfileUI(userData); } catch(e) { console.error(e); }
        } else {
          const profile = await fetchDiscordProfile(tokenFromCookie);
          if (profile) { userData = profile; setCookie('discord_user', JSON.stringify(profile), 7); updateProfileUI(profile); }
        }
      }
    }

    async function sendWebhook() {
      if (!BOTGHOST_WEBHOOK_URL || BOTGHOST_WEBHOOK_URL.includes('YOUR')) {
        return alert('BOTGHOST_WEBHOOK_URL variable config missing inside script.');
      }
      const message = document.getElementById('webhook-msg').value;
      const payload = {
        content: message,
        embeds: [{
          title: "Live Terminal Dispatch",
          color: 8128493,
          fields: [
            { name: "Operator Identity", value: userData ? `${userData.username}#${userData.discriminator} (<@${userData.id}>)` : "Unverified Web Session", inline: true }
          ],
          timestamp: new Date().toISOString()
        }]
      };

      try {
        const res = await fetch(BOTGHOST_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert('Payload processed and delivered safely!');
        } else {
          const text = await res.text();
          alert('Endpoint rejected client request package. ' + res.status + ': ' + text);
        }
      } catch (e) {
        alert('CORS network event restriction blocked transaction. Make sure your BotGhost webhook configuration permits web/browser data origins.');
        console.error(e);
      }
    }

    window.addEventListener('load', checkCallback);
  </script>
</body>
</html>
